<svg xmlns="http://www.w3.org/2000/svg" width="900" height="14" viewBox="0 0 900 14" font-family="'JetBrains Mono','DejaVu Sans Mono','Courier New',monospace">
  <defs>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#00b3fe" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-300 0;900 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="7" x2="900" y2="7" stroke="#3b4b3f" stroke-opacity="0.6"/>
  <line x1="0" y1="7" x2="900" y2="7" stroke="url(#sweep)" stroke-width="2"/>
  <text x="450" y="11" font-size="11" fill="#00ff9c" text-anchor="middle" fill-opacity="0.6">+</text>
</svg>
